name: Trigger AI News Processing

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    # Also allow manual trigger from GitHub Actions UI

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger AI Pipeline
        run: |
          echo "Triggering AI pipeline at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.PROCESS_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.API_URL }}/api/process")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Failed to trigger pipeline (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Pipeline triggered successfully"
