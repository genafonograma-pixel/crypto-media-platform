<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0A0B0E" />
  
  <g id="bitcoin-bandit" transform="translate(32, 30) scale(0.2)">
    
    <!-- 1. BITCOIN COIN (FULL CIRCLE, CENTERED AT 0, 10, RADIUS 84) -->
    <g id="coin" transform="translate(0, 10)">
      <!-- Dark edge outline -->
      <circle cx="0" cy="0" r="88" fill="#0C0D10" />
      
      <!-- Outer Coin Rim (Dark Amber) -->
      <circle cx="0" cy="0" r="84" fill="#D97706" />

      <!-- Inner Coin Face (Vibrant Bitcoin Orange #F7931A) -->
      <circle cx="0" cy="0" r="76" fill="#F7931A" />
      
      <!-- Inner milled ring -->
      <circle cx="0" cy="0" r="68" fill="none" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.4" />

      <!-- Crisp White Bitcoin Symbol ₿ (tilted 14 deg standard angle) -->
      <g transform="rotate(14) scale(1.24)" fill="#FFFFFF">
        <!-- Top vertical hashes -->
        <rect x="-6" y="-50" width="5.5" height="14" rx="1.5" />
        <rect x="6" y="-50" width="5.5" height="14" rx="1.5" />
        <!-- Bottom vertical hashes -->
        <rect x="-6" y="35" width="5.5" height="14" rx="1.5" />
        <rect x="6" y="35" width="5.5" height="14" rx="1.5" />

        <!-- 'B' Main Shape -->
        <path d="
          M -22 -36
          L 13 -36
          C 26 -36, 36 -28, 36 -17
          C 36 -7, 28 -2, 18 0
          C 31 2, 40 11, 40 23
          C 40 37, 27 45, 11 45
          L -22 45
          Z
          M -11 -26
          L 11 -26
          C 18 -26, 24 -22, 24 -17
          C 24 -11, 18 -7, 11 -7
          L -11 -7
          Z
          M -11 5
          L 13 5
          C 20 5, 27 10, 27 19
          C 27 28, 20 35, 13 35
          L -11 35
          Z
        " fill-rule="evenodd" />
      </g>
    </g>

    <!-- 2. RED BANDANA / NECKERCHIEF (WRAPS AROUND BOTTOM OF COIN) -->
    <g id="bandana" transform="translate(0, 58)">
      <!-- Bandana Base Outline -->
      <path d="
        M -74 2
        C -45 22, 45 22, 74 2
        C 84 30, 70 58, 48 82
        L 0 132
        L -48 82
        C -70 58, -84 30, -74 2
        Z
      " fill="#7F1D1D" stroke="#0C0D10" stroke-width="5" stroke-linejoin="round" />

      <!-- Main Red Cloth Body -->
      <path d="
        M -72 4
        C -44 24, 44 24, 72 4
        C 82 32, 66 60, 44 84
        L 0 128
        L -44 84
        C -66 60, -82 32, -72 4
        Z
      " fill="#DC2626" />

      <!-- Top Fold Rim -->
      <path d="
        M -68 8
        Q 0 28 68 8
        Q 0 18 -68 8
        Z
      " fill="#EF4444" />

      <!-- Shadow Folds -->
      <path d="
        M -60 28
        C -30 48, 10 44, 36 34
        C 10 46, -28 50, -54 36
      " fill="#991B1B" />

      <path d="
        M -40 50
        Q -10 82 0 116
        Q 12 86 32 62
        C 12 72, -12 72, -40 50
        Z
      " fill="#991B1B" />
      
      <!-- Highlight Accent -->
      <path d="
        M -32 44
        Q -6 74 0 110
      " fill="none" stroke="#F87171" stroke-width="3.5" stroke-linecap="round" />

      <!-- Neckerchief Knot on Right Side -->
      <g id="knot" transform="translate(70, 14)">
        <circle cx="0" cy="0" r="11" fill="#DC2626" stroke="#0C0D10" stroke-width="4.5" />
        <circle cx="-2" cy="-2" r="7" fill="#EF4444" />

        <!-- Upper Tail -->
        <path d="
          M 4 -5
          C 18 -15, 38 -10, 46 2
          C 38 10, 20 8, 4 4
          Z
        " fill="#DC2626" stroke="#0C0D10" stroke-width="4.5" stroke-linejoin="round" />
        <path d="M 12 -3 Q 26 -6 38 1" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />

        <!-- Lower Tail -->
        <path d="
          M 2 4
          C 10 20, 20 34, 30 42
          C 32 36, 26 20, 10 10
          Z
        " fill="#991B1B" stroke="#0C0D10" stroke-width="4.5" stroke-linejoin="round" />
        <path d="
          M 3 6
          C 12 18, 22 28, 28 36
          C 30 32, 24 18, 8 8
          Z
        " fill="#DC2626" stroke="#0C0D10" stroke-width="3.5" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 3. COWBOY HAT (PERCHED ON TOP, ARCHING UP OVER COIN, WITH DOWNTURNED WING BRIM) -->
    <!-- Center: x=0, y=-54 -->
    <g id="cowboy-hat" transform="translate(0, -56)">
      
      <!-- Crown Shadow on Coin -->
      <path d="
        M -65 20
        C -30 38, 30 38, 65 20
        C 30 26, -30 26, -65 20
        Z
      " fill="#0C0D10" opacity="0.38" />

      <!-- Crown Body (Smooth rounded cowboy crown - NO split/wedge down the middle!) -->
      <path d="
        M -56 8
        C -54 -28, -48 -70, -22 -72
        C -8 -73, 8 -73, 22 -72
        C 48 -70, 54 -28, 56 8
        Z
      " fill="#A0522D" stroke="#0C0D10" stroke-width="5" stroke-linejoin="round" />

      <!-- Crown Subtle 2D Shadow on Right (smooth shading, no split) -->
      <path d="
        M 8 -72
        C 20 -72, 42 -68, 50 -32
        C 54 -10, 55 2, 56 8
        L 24 8
        C 24 -14, 18 -48, 8 -72
        Z
      " fill="#78350F" opacity="0.4" />

      <!-- Crown Left Highlight Curve -->
      <path d="
        M -36 -56
        C -44 -32, -46 0, -44 8
      " fill="none" stroke="#CD7F32" stroke-width="4" stroke-linecap="round" opacity="0.6" />

      <!-- Brim Base (Arches UP in center, curves DOWN at the sides like reference) -->
      <!-- Left tip at (-142, 28), arching up to center (0, -2), right tip at (142, 28) -->
      <path d="
        M -144 26
        C -132 -10, -78 -10, 0 -6
        C 78 -10, 132 -10, 144 26
        C 126 50, 96 36, 68 18
        C 42 6, -42 6, -68 18
        C -96 36, -126 50, -144 26
        Z
      " fill="#B45920" stroke="#0C0D10" stroke-width="5.5" stroke-linejoin="round" />

      <!-- Brim Top Highlight Rolled Edge -->
      <path d="
        M -136 22
        C -124 -6, -75 -6, 0 -3
        C 75 -6, 124 -6, 136 22
      " fill="none" stroke="#E28448" stroke-width="3" stroke-linecap="round" />

      <!-- Studded Leather Hat Band (Placed right on brim rim so it's fully visible!) -->
      <path d="
        M -54 2
        Q 0 10 54 2
        L 55 14
        Q 0 22 -55 14
        Z
      " fill="#1C1008" stroke="#0C0D10" stroke-width="3.5" />

      <!-- 3 Prominent Golden Studs on Hatband (clearly visible above brim) -->
      <!-- Left Stud -->
      <circle cx="-32" cy="7.5" r="5" fill="#FBBF24" stroke="#0C0D10" stroke-width="2" />
      <circle cx="-33" cy="6" r="1.5" fill="#FEF08A" />

      <!-- Center Stud -->
      <circle cx="0" cy="11.5" r="5.5" fill="#FBBF24" stroke="#0C0D10" stroke-width="2" />
      <circle cx="-1" cy="10" r="1.8" fill="#FEF08A" />

      <!-- Right Stud -->
      <circle cx="32" cy="7.5" r="5" fill="#FBBF24" stroke="#0C0D10" stroke-width="2" />
      <circle cx="31" cy="6" r="1.5" fill="#FEF08A" />

    </g>

  </g>
  
</svg>