<script>
(function(){
var T=9, YTOP=[0], X0=-49;
var RB=[0,0,0,0], BALL=[290.229, 13.264, 42, 42];
var BCX=BALL[0]+BALL[2]/2, BCY=BALL[1]+BALL[3]/2, BR=BALL[2]/2;
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var ad=$('#ad'), plateImg=$('#plate'), ballEl=$('#ball');

// ---- seeded random (deterministic) ----
var seed=7; function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
// ---- ribbon wave (free-running) ----
var wave={ph:0}, AMP=0, LAM=120;
function wdy(x){return AMP*Math.sin(2*Math.PI*x/LAM+wave.ph)}
var rc={};
function renderRibbon(){return;
  var W=rc.width, H=ribbonImg.height, s=6; rx.clearRect(0,0,rc.width,rc.height);
  for(var sx=0;sx<W;sx+=s){var w=Math.min(s,W-sx); var xc=RB[0]+(sx+w/2)/2; rx.drawImage(ribbonImg,sx,0,w,H,sx,6+wdy(xc)*2,w,H);}
}
// ---- ball placement ----
function ytop(x){var i=Math.max(0,Math.min(YTOP.length-1,Math.round(x-X0))); var v=YTOP[i]; while(v===null&&i<YTOP.length-1){i++;v=YTOP[i]} return v}
var OFF=ytop(BCX)-BCY;
var B={p:0,k:0,sq:1,spin:0};
function placeBall(){
  var x,y,rot,sc=1;
  if(B.k<=0){
    x=BCX+60*(1-B.p);
    y=BCY-10*Math.abs(Math.sin(B.p*Math.PI*2))*(1-B.p);
    rot=(x-BCX)/BR*57.2958;
    y+=wdy(x);
  } else {
    var k=B.k, a=1-k;
    x=a*a*BCX+2*a*k*318+k*k*IMP[0]; y=a*a*BCY+2*a*k*22+k*k*IMP[1];
    y+=wdy(BCX)*a; rot=k*900; sc=1-0.7*k;
  }
  ballEl.style.transform='translate('+(x-BCX).toFixed(2)+'px,'+(y-BCY).toFixed(2)+'px) rotate('+(rot+B.spin).toFixed(1)+'deg) scale('+sc.toFixed(3)+','+(sc*B.sq).toFixed(3)+')';
}
// ---- net warp (drawn only while the ripple runs) ----
var nc=$('#net'), nx=nc.getContext('2d'), N={amp:0,ph:0}, IMP=[312,5], NL=278, NT=-2, NW=42, NH=18;
function renderNet(){
  nx.clearRect(0,0,nc.width,nc.height);
  if(N.amp<0.002){nc.style.opacity=0;return}
  nc.style.opacity=1;
  var c=2;
  for(var y=NT;y<NT+NH;y+=c)for(var x=NL;x<NL+NW;x+=c){
    var px=x+c/2,py=y+c/2,dx=IMP[0]-px,dy=IMP[1]-py,r=Math.sqrt(dx*dx+dy*dy)||1;
    var w=N.amp*(0.7*Math.exp(-(r/9)*(r/9))+0.45*Math.exp(-r/16)*Math.sin(r/3-N.ph));
    var edge=Math.min(1,(x-NL)/6,(NL+NW-x-c)/6,(y-NT)/4,(NT+NH-y-c)/4); if(edge<0)edge=0;
    var m=w*2.5*edge, ox=dx/r*m, oy=dy/r*m;
    nx.drawImage(plateImg,(x-20)*2,(y+40)*2,c*2,c*2,(x-NL+ox)*2-0.5,(y-NT+oy)*2-0.5,c*2+1,c*2+1);
  }
}
// ---- particle pools ----
function dots(parent,n,cls){var a=[];for(var i=0;i<n;i++){var d=document.createElement('div');d.className='dot';parent.appendChild(d);a.push(d)}return a}
var amb=dots($('#amb'),16), spray=dots($('#spray'),20), sparks=dots($('#sparks'),14);
amb.forEach(function(d){var s=1+rnd()*1.8;gsap.set(d,{width:s,height:s,left:120+rnd()*360,top:-10+rnd()*70,background:rnd()<.5?'#C9A6FF':'#ffffff',opacity:0})});
spray.forEach(function(d,i){var s=1.6+rnd()*1.8;gsap.set(d,{width:s,height:s*1.4,background:i%3?'#5FAE3A':'#9BE36A',opacity:0})});
sparks.forEach(function(d,i){var s=1.5+rnd()*2;gsap.set(d,{width:s,height:s,left:IMP[0],top:IMP[1],background:i%2?'#ffffff':'#B98BFF',opacity:0})});

function build(){
  var tl=gsap.timeline({paused:true,repeat:-1});
  var hw=$$('#head .hw'), flashes=$$('#head .flash'), tl_=$$('#tag .tl');
  // start state
  tl.set('#cam',{scale:0.8},0).set('#dark',{opacity:0.92},0).set(ballEl,{opacity:0},0)
    .set(B,{p:0,k:0,sq:1,spin:0,onUpdate:placeBall},0)
    .set(rc,{x:0,clipPath:'inset(0% 0% 0% 100%)',webkitClipPath:'inset(0% 0% 0% 100%)'},0).set(spray.concat(sparks),{opacity:0},0);
  // 1 lights on + camera push
  [[.08,.45],[.14,.85],[.22,.25],[.27,.7],[.36,.15],[.42,.5]].forEach(function(f){tl.set('#dark',{opacity:f[1]},f[0])});
  tl.to('#dark',{opacity:0,duration:.35,ease:'power1.out'},.5)
    .to('#cam',{scale:1,duration:1.5,ease:'power3.out'},.05);
  // 2 logo + tagline
  tl.fromTo(['#lbet','#lcom'],{y:-400,opacity:0},{y:0,opacity:1,duration:.6,ease:'bounce.out',stagger:.08},.3)
    .fromTo('#l25',{scale:0,rotation:-200,transformOrigin:'50% 50%',opacity:0},{scale:1,rotation:0,opacity:1,duration:.55,ease:'back.out(2.5)'},.55);
  tl_.forEach(function(g,i){var t=.7+rnd()*.45; tl.fromTo(g,{opacity:0},{opacity:1,duration:.04},t).to(g,{opacity:.2,duration:.03},t+.06).to(g,{opacity:1,duration:.03},t+.11)});
  // 3 headline slams
  tl.fromTo(hw,{scale:2.6,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,duration:.32,ease:'power4.in',stagger:{each:.16}},1.0);
  [1.32,1.48,1.64,1.80].forEach(function(t,i){tl.fromTo('#stage',{x:0,y:0},{keyframes:[{x:i%2?-2.5:2.5,y:1.5,duration:.04},{x:i%2?2:-2,y:-1.2,duration:.04},{x:0,y:0,duration:.05}]},t)});
  flashes.forEach(function(f,i){tl.fromTo(f,{opacity:1},{opacity:0,duration:.35,ease:'power2.in'},1.64+i*.16)});
  // 4 ribbon unfurls, ball rolls in
  tl.to(rc,{clipPath:'inset(0% 0% 0% 0%)',webkitClipPath:'inset(0% 0% 0% 0%)',duration:.6,ease:'power2.inOut'},1.3);

  sparks.forEach(function(d,i){var a=i/sparks.length*Math.PI*2+rnd()*.3, v=16+rnd()*18;

  tl.to('#cta',{keyframes:[{scale:1.09,duration:.16,ease:'power2.out'},{scale:1,duration:.3,ease:'power2.inOut'}]},I+.25)

  tl.to(hw,{scale:.5,opacity:0,duration:.3,ease:'power2.in',stagger:.05},8.2)

    .to('#cta',{scale:0,duration:.3,ease:'back.in(2)'},8.25)
    
    .to('#cam',{scale:.8,duration:.6,ease:'power2.in'},8.4)

    .set('#logo',{opacity:1,y:0},T).set(rc,{x:0,clipPath:'inset(0% 0% 0% 100%)',webkitClipPath:'inset(0% 0% 0% 100%)'},T);
  // free-running ambient

}
