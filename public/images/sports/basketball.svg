<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="50%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F4A917" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f24" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#F4A917"/>

  <!-- Sport Graphic -->
  <g transform="translate(0, -20)">
    <circle cx="600" cy="300" r="100" fill="#151515" stroke="#F4A917" stroke-width="4"/>
           <line x1="500" y1="300" x2="700" y2="300" stroke="#F4A917" stroke-width="4"/>
           <line x1="600" y1="200" x2="600" y2="400" stroke="#F4A917" stroke-width="4"/>
           <path d="M530 230 Q600 300 530 370" fill="none" stroke="#F4A917" stroke-width="4"/>
           <path d="M670 230 Q600 300 670 370" fill="none" stroke="#F4A917" stroke-width="4"/>
  </g>

  <!-- Category Tag -->
  <rect x="475" y="450" width="250" height="28" rx="6" fill="#F4A917" fill-opacity="0.12" stroke="#F4A917" stroke-width="1"/>
  <text x="600" y="469" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#F4A917" text-anchor="middle">SPORTS25 NEWS</text>

  <!-- Title & Subtitle -->
  <text x="600" y="525" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">BASKETBALL & NBA</text>
  <text x="600" y="565" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#888899" text-anchor="middle">GAME HIGHLIGHTS, STATS & LEAGUE INTELLIGENCE</text>

  <!-- Subtle bottom border line -->
  <line x1="200" y1="620" x2="1000" y2="620" stroke="#252528" stroke-width="1"/>
</svg>